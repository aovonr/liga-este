<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga Este 26-27</title>
<style>
  :root{
    --cream:#F5F1E6;
    --paper:#FBF9F3;
    --ink:#241F18;
    --ink-soft:#6B6255;
    --pitch:#1B4332;
    --pitch-deep:#12301F;
    --gold:#C9971F;
    --line:#DFD7C2;
    --line-soft:#EAE3D2;
    --coral:#B5482A;
    --owned-bg:#EFF3EA;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#161512;
      --paper:#1F1D18;
      --ink:#EDE8DC;
      --ink-soft:#A69C89;
      --pitch:#2E6B4C;
      --pitch-deep:#1B4332;
      --gold:#D9AE4E;
      --line:#3A362C;
      --line-soft:#2A2721;
      --coral:#D9764F;
      --owned-bg:#233024;
    }
  }
  html.force-light{
    --cream:#F5F1E6;
    --paper:#FBF9F3;
    --ink:#241F18;
    --ink-soft:#6B6255;
    --pitch:#1B4332;
    --pitch-deep:#12301F;
    --gold:#C9971F;
    --line:#DFD7C2;
    --line-soft:#EAE3D2;
    --coral:#B5482A;
    --owned-bg:#EFF3EA;
  }
  html.force-dark{
    --cream:#161512;
    --paper:#1F1D18;
    --ink:#EDE8DC;
    --ink-soft:#A69C89;
    --pitch:#2E6B4C;
    --pitch-deep:#1B4332;
    --gold:#D9AE4E;
    --line:#3A362C;
    --line-soft:#2A2721;
    --coral:#D9764F;
    --owned-bg:#233024;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  .display{
    font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(180deg,var(--pitch) 0%, var(--pitch-deep) 100%);
    color:var(--cream);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 40px, transparent 40px 80px);
    pointer-events:none;
  }
  .header-inner{max-width:720px;margin:0 auto;position:relative;}
  .eyebrow{
    font-size:12.5px;
    letter-spacing:.04em;
    color:var(--gold);
    font-weight:600;
    margin:0 0 4px;
  }
  h1{
    font-size:26px;
    margin:0 0 14px;
    font-weight:600;
    line-height:1.15;
  }
  .progress-wrap{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .progress-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .progress-top .big{
    font-size:22px;
    font-weight:700;
    font-family:Georgia,serif;
  }
  .progress-top .small{
    font-size:12.5px;
    color:rgba(245,241,230,0.7);
  }
  .bar-track{
    height:8px;
    background:rgba(255,255,255,0.12);
    border-radius:5px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--gold);
    border-radius:5px;
    transition:width .35s ease;
    width:0%;
  }
  .split-progress{
    display:flex;
    gap:16px;
    margin-top:12px;
  }
  .split-item{flex:1; min-width:0;}
  .split-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:rgba(245,241,230,0.65);
    margin-bottom:4px;
  }
  .split-bar-track{
    height:5px;
    background:rgba(255,255,255,0.12);
    border-radius:4px;
    overflow:hidden;
  }
  .split-bar-fill{
    height:100%;
    border-radius:4px;
    transition:width .35s ease;
  }
  .split-bar-fill.normal{background:#8FBF9F;}
  .split-bar-fill.segunda{background:var(--gold);}

  /* ---------- Panel resumen ---------- */
  .summary-panel{
    max-width:720px;
    margin:14px auto 0;
    padding:0 20px;
  }
  .summary-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .summary-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 16px;
    cursor:pointer;
  }
  .summary-head-title{
    font-size:14px;
    font-weight:600;
  }
  .summary-body{display:none; border-top:1px solid var(--line-soft);}
  .summary-panel.open .summary-body{display:block;}
  .summary-panel.open .summary-chev{transform:rotate(180deg);}
  .summary-chev{width:16px;height:16px;color:var(--ink-soft); transition:transform .2s ease;}
  .summary-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--line-soft);
    gap:12px;
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-row-name{font-size:13px; font-weight:500; flex:1; min-width:0;}
  .summary-row-stats{
    display:flex; align-items:center; gap:8px;
    flex:0 0 auto;
  }
  .summary-row-bar{
    width:70px; height:5px; border-radius:4px;
    background:var(--line-soft);
    overflow:hidden;
  }
  .summary-row-bar-fill{height:100%; background:var(--pitch); border-radius:4px;}
  .summary-row-count{font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
  .summary-empty{padding:14px 16px; font-size:12.5px; color:var(--ink-soft);}
  /* Oculto por ahora: solo hay una temporada. Quitar esta línea para reactivarlo. */
  .summary-panel{display:none;}

  /* ---------- Vista mosaico ---------- */
  .view-toggle{
    padding:11px 14px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--paper);
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .view-toggle:hover{background:var(--line-soft);}
  .mosaic-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));
    gap:14px;
    max-width:720px;
    margin:0 auto;
    padding:6px 20px 30px;
  }
  .mosaic-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    cursor:pointer;
  }
  .mosaic-badge{
    width:64px;
    height:64px;
    flex:0 0 auto;
    margin:0 0 6px;
    border-radius:16px;
    background:#fff;
    border:2px solid var(--line);
    padding:8px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .mosaic-badge img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
  }
  .mosaic-badge.complete{border-color:#2F7D46; box-shadow:0 0 0 2px rgba(47,125,70,0.25);}
  .mosaic-badge .initials{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;
    font-weight:700;
    font-size:15px;
    color:#fff;
    border-radius:10px;
  }
  .mosaic-check{
    position:absolute;
    bottom:-2px; right:-2px;
    width:18px;height:18px;
    background:#2F7D46;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .mosaic-check svg{width:11px;height:11px;}
  .mosaic-name{
    font-size:10.5px;
    font-weight:600;
    line-height:1.2;
    color:var(--ink);
    margin-bottom:2px;
    max-width:84px;
  }
  .mosaic-pct{
    font-size:9.5px;
    color:var(--ink-soft);
  }

  /* ---------- Densidad de la lista ---------- */
  body.density-compact .row{padding:6px 16px;}
  body.density-compact .row-name .name{font-size:13px;}
  body.density-compact .row-name .role{font-size:10px;}
  body.density-compact .num{font-size:11px;}

  body.density-large .row{padding:14px 16px;}
  body.density-large .row-name .name{font-size:15.5px;}
  body.density-large .row-name .role{font-size:12px;}
  body.density-large .num{font-size:13px;}

  /* ---------- Completado ---------- */
  .complete-check{
    width:14px;height:14px;
    display:inline-block;
    vertical-align:middle;
    margin-left:5px;
    flex:0 0 auto;
  }
  .rarity-tag{
    display:inline-block;
    font-size:9px;
    font-weight:700;
    color:#fff;
    padding:2px 6px;
    border-radius:5px;
    margin-left:6px;
    vertical-align:middle;
    letter-spacing:.02em;
  }

  /* ---------- Celebración ---------- */
  .confetti-overlay{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:9999;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-14px;
    width:8px;height:14px;
    opacity:0.95;
    border-radius:2px;
    animation-name:confetti-fall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    to{ transform: translateY(112vh) rotate(720deg); }
  }
  .celebrate-banner{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%) translateY(-24px);
    background:var(--pitch);
    color:#fff;
    padding:12px 22px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 10px 28px rgba(0,0,0,0.28);
    z-index:10000;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    text-align:center;
    max-width:88vw;
  }
  .celebrate-banner.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ---------- Marcar/desmarcar todo por sección ---------- */
  .mark-all-btn{
    font-size:10.5px;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 8px;
    cursor:pointer;
    white-space:nowrap;
    flex:0 0 auto;
  }
  .mark-all-btn:hover{background:var(--line-soft);}

  /* ---------- Modal propio (sustituye alert/prompt/confirm) ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,18,14,0.55);
    z-index:10001;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-card{
    background:var(--paper);
    border-radius:14px;
    max-width:480px; width:100%;
    padding:18px;
    max-height:82vh;
    overflow:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .modal-title{font-size:15px; font-weight:700; margin:0 0 10px;}
  .modal-hint{font-size:12px; color:var(--ink-soft); margin:0 0 8px;}
  .modal-textarea{
    width:100%; min-height:130px;
    font-size:12.5px; padding:10px;
    border-radius:8px; border:1px solid var(--line);
    background:var(--cream); color:var(--ink);
    font-family:ui-monospace,Menlo,monospace;
    resize:vertical;
  }
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:14px;}
  .modal-btn{
    padding:9px 15px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper);
    color:var(--ink);
    cursor:pointer; font-size:13px;
  }
  .modal-btn.primary{background:var(--pitch); color:#fff; border-color:var(--pitch);}

  /* ---------- Controls ---------- */
  .controls{
    max-width:720px;
    margin:0 auto;
    padding:16px 20px 0;
  }
  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  #search{
    flex:1;
    padding:11px 14px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--paper);
    font-size:14.5px;
    color:var(--ink);
  }
  #search:focus{outline:2px solid var(--pitch); outline-offset:1px;}
  .icon-btn{
    padding:11px 14px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--paper);
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .icon-btn:hover{background:var(--line-soft);}
  .filter-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:14px;
    -webkit-overflow-scrolling:touch;
  }
  .filter-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip.active{
    background:var(--pitch);
    border-color:var(--pitch);
    color:var(--cream);
  }

  /* ---------- Sections ---------- */
  main{max-width:720px;margin:0 auto;padding:6px 20px 60px;}
  .section{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:5px solid var(--accent, var(--pitch));
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
    gap:12px;
  }
  .section-head-left{display:flex; align-items:center; gap:11px; min-width:0;}
  .badge{
    width:34px;height:34px;border-radius:9px;
    background:var(--accent, var(--pitch));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    flex:0 0 auto;
    font-family:Georgia,serif;
    overflow:hidden;
  }
  .badge.has-logo{
    background:#fff;
    padding:3px;
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .section-title{
    font-size:15.5px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .section-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .section-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .mini-bar{
    width:52px;height:5px;border-radius:3px;
    background:var(--line-soft);
    overflow:hidden;
    display:none;
  }
  @media(min-width:480px){.mini-bar{display:block;}}
  .mini-bar-fill{height:100%; background:var(--accent, var(--pitch));}
  .chev{
    width:18px;height:18px;
    transition:transform .2s ease;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  .section.open .chev{transform:rotate(180deg);}
  .section-body{
    display:none;
    border-top:1px solid var(--line-soft);
  }
  .section.open .section-body{display:block;}

  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;
    user-select:none;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:var(--line-soft);}
  .row.owned{background:var(--owned-bg);}
  .num{
    width:34px;
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    text-align:center;
    font-family:Georgia,serif;
  }
  .row.owned .num{color:var(--pitch);}
  .row-name{flex:1; min-width:0;}
  .row-name .name{
    font-size:14px;
    font-weight:500;
    color:var(--ink);
  }
  .row.owned .row-name .name{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:var(--ink-soft);
    text-decoration-thickness:1px;
  }
  .row-name .role{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:capitalize;
  }
  .ed-badge{
    font-size:9.5px;
    font-weight:700;
    color:var(--gold);
    border:1px solid var(--gold);
    border-radius:4px;
    padding:1px 5px;
    margin-left:6px;
    white-space:nowrap;
  }
  .check{
    width:22px;height:22px;
    border-radius:6px;
    border:1.5px solid var(--line);
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .row.owned .check{
    background:var(--pitch);
    border-color:var(--pitch);
  }
  .check svg{width:13px;height:13px;opacity:0; transition:opacity .1s;}
  .row.owned .check svg{opacity:1;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }

  footer{
    max-width:720px;margin:0 auto;padding:0 20px 40px;
    color:var(--ink-soft);
    font-size:12px;
    text-align:center;
  }

  .theme-toggle{
    position:absolute;
    top:26px;
    right:20px;
    width:36px;height:36px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);
    color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    z-index:20;
  }
  .save-toast{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--cream);
    padding:9px 16px;
    border-radius:999px;
    font-size:12.5px;
    opacity:0;
    transition:opacity .25s, transform .25s;
    pointer-events:none;
    z-index:50;
  }
  .save-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌓</button>
  <div class="header-inner">
    <h1 class="display">Liga Este 26-27</h1>
    <div class="progress-wrap">
      <div class="progress-top">
        <span class="big" id="totalOwned">0 / 0</span>
        <span class="small" id="totalPct">0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="totalBar"></div></div>
      <div class="split-progress">
        <div class="split-item">
          <div class="split-label"><span>Cromos normales</span><span id="normalCount">0/0</span></div>
          <div class="split-bar-track"><div class="split-bar-fill normal" id="normalBar"></div></div>
        </div>
        <div class="split-item">
          <div class="split-label"><span>2ª edición</span><span id="segundaCount">0/0</span></div>
          <div class="split-bar-track"><div class="split-bar-fill segunda" id="segundaBar"></div></div>
        </div>
      </div>
    </div>
  </div>
</header>


<div class="summary-panel" id="summaryPanel">
  <div class="summary-card">
    <div class="summary-head" id="summaryHead">
      <span class="summary-head-title">Resumen de tus colecciones</span>
      <svg class="summary-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="summary-body" id="summaryBody"></div>
  </div>
</div>

<div class="controls">
  <div class="search-row">
    <input id="search" type="text" placeholder="Buscar jugador, equipo o número…" autocomplete="off">
    <button class="view-toggle" id="viewToggle">🗂️ Mosaico</button>
    <button class="view-toggle" id="densityToggle">↕️ Cómoda</button>
    <button class="icon-btn" id="toggleAll">Expandir todo</button>
  </div>
  <div class="filter-row" id="filterRow"></div>
</div>

<div id="mosaicView" class="mosaic-grid" style="display:none;"></div>

<main id="sections"></main>

<footer>
  Tu progreso se guarda automáticamente en este dispositivo.
  <br>
  <div style="display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap;">
    <button class="icon-btn" id="curiosidadesBtn">✨ Curiosidades</button>
    <button class="icon-btn" id="tutorialBtn">❓ Cómo funciona</button>
  </div>
  <div style="display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap;">
    <button class="icon-btn" id="missingBtn">Descargar lista de faltantes</button>
    <button class="icon-btn" id="copyMissingBtn">Copiar lista de faltantes</button>
  </div>
  <div style="display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap;">
    <button class="icon-btn" id="exportBtn">Exportar progreso</button>
    <button class="icon-btn" id="importBtn">Importar progreso</button>
    <button class="icon-btn" id="resetBtn">Reiniciar checklist</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none;">
</footer>

<div class="save-toast" id="toast">Guardado</div>

<script>
/* ================= DATA ================= */
/* item: [numero, nombre, rol, esSegundaEdicion] */
const SECTIONS = [

function slugify(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

const sections = SECTIONS.map((s, idx) => ({
  name: s[0],
  slug: slugify(s[0]),
  accent: PALETTE[idx % PALETTE.length],
  items: s[1].map(it => ({num: it[0], name: it[1], role: it[2], ed: it[3]}))
}));

/* ================= TEMA ================= */
const THEME_KEY = "theme-preference-v1";
let themeMode = "auto";

function applyTheme(mode){
  document.documentElement.classList.remove("force-light","force-dark");
  if(mode==="light") document.documentElement.classList.add("force-light");
  if(mode==="dark") document.documentElement.classList.add("force-dark");
  document.getElementById("themeToggle").textContent = mode==="light" ? "☀️" : mode==="dark" ? "🌙" : "🌓";
}

function initThemeButton(){
  applyTheme(themeMode);
  document.getElementById("themeToggle").addEventListener("click", ()=>{
    const order = ["auto","dark","light"];
    const current = order.includes(themeMode) ? themeMode : "auto";
    themeMode = order[(order.indexOf(current)+1) % order.length];
    applyTheme(themeMode);
    storageSet(THEME_KEY, themeMode); // se guarda en segundo plano, sin bloquear el botón
  });
}

async function loadThemePreference(){
  try{
    const val = await storageGet(THEME_KEY);
    if(val){ themeMode = val; applyTheme(themeMode); }
  }catch(e){ /* si falla, se queda en "auto" */ }
}

/* ================= DENSIDAD DE LA LISTA ================= */
const DENSITY_KEY = "density-preference-v1";
let densityMode = "comfortable"; // "compact" | "comfortable" | "large"

function applyDensity(mode){
  document.body.classList.remove("density-compact","density-large");
  if(mode==="compact") document.body.classList.add("density-compact");
  if(mode==="large") document.body.classList.add("density-large");
  const labels = {compact:"↕️ Compacta", comfortable:"↕️ Cómoda", large:"↕️ Grande"};
  document.getElementById("densityToggle").textContent = labels[mode] || labels.comfortable;
}

function initDensityButton(){
  applyDensity(densityMode);
  document.getElementById("densityToggle").addEventListener("click", ()=>{
    const order = ["comfortable","compact","large"];
    const idx = order.includes(densityMode) ? order.indexOf(densityMode) : 0;
    densityMode = order[(idx+1) % order.length];
    applyDensity(densityMode);
    storageSet(DENSITY_KEY, densityMode);
  });
}

async function loadDensityPreference(){
  try{
    const val = await storageGet(DENSITY_KEY);
    if(val){ densityMode = val; applyDensity(densityMode); }
  }catch(e){ /* si falla, se queda en "comfortable" */ }
}

/* ================= REGISTRO DE COLECCIONES (panel resumen) ================= */
const REGISTRY_KEY = "collections-registry-v1";
const COLLECTION_ID = "liga-este-26-27";
const COLLECTION_NAME = "Liga Este 26-27";

async function updateRegistry(total, own){
  try{
    const raw = await storageGet(REGISTRY_KEY);
    const registry = raw ? JSON.parse(raw) : {};
    registry[COLLECTION_ID] = {name: COLLECTION_NAME, total, own, updated: Date.now()};
    await storageSet(REGISTRY_KEY, JSON.stringify(registry));
    return registry;
  }catch(e){
    return null;
  }
}

async function renderSummaryPanel(){
  const body = document.getElementById("summaryBody");
  let registry = null;
  try{
    const raw = await storageGet(REGISTRY_KEY);
    registry = raw ? JSON.parse(raw) : {};
  }catch(e){
    registry = {};
  }
  const entries = Object.values(registry || {});
  if(entries.length === 0){
    body.innerHTML = `<div class="summary-empty">Todavía no hay otras colecciones registradas en este dispositivo.</div>`;
    return;
  }
  entries.sort((a,b)=> (b.own/b.total) - (a.own/a.total));
  body.innerHTML = entries.map(e=>{
    const pct = e.total ? Math.round(e.own/e.total*100) : 0;
    return `
      <div class="summary-row">
        <div class="summary-row-name">${e.name}</div>
        <div class="summary-row-stats">
          <div class="summary-row-bar"><div class="summary-row-bar-fill" style="width:${pct}%"></div></div>
          <div class="summary-row-count">${e.own}/${e.total}</div>
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("summaryHead").addEventListener("click", ()=>{
  document.getElementById("summaryPanel").classList.toggle("open");
});

/* ================= HITOS DE PROGRESO ================= */
const MILESTONE_KEY = "milestones-reached-v1";
let reachedMilestones = [];

async function loadMilestones(){
  try{
    const val = await storageGet(MILESTONE_KEY);
    if(val) reachedMilestones = JSON.parse(val);
  }catch(e){ reachedMilestones = []; }
}

function syncMilestonesSilently(){
  const {total, own} = totalCounts();
  if(total===0) return;
  const pct = (own/total)*100;
  [25,50,75,100].forEach(t=>{
    if(pct >= t && !reachedMilestones.includes(t)) reachedMilestones.push(t);
  });
}

function milestoneMessage(t){
  if(t===25) return "💪 ¡25% del álbum conseguido!";
  if(t===50) return "🔥 ¡Mitad del álbum completada!";
  if(t===75) return "🚀 ¡75%! Ya casi lo tienes";
  return "";
}

function checkMilestones(){
  const {total, own} = totalCounts();
  if(total===0) return;
  const pct = (own/total)*100;
  [25,50,75,100].forEach(t=>{
    if(pct >= t && !reachedMilestones.includes(t)){
      reachedMilestones.push(t);
      if(t===100){
        celebrateAll();
      } else {
        spawnConfetti(40);
        showBanner(milestoneMessage(t));
      }
    }
    if(pct < t && reachedMilestones.includes(t)){
      reachedMilestones = reachedMilestones.filter(x=> x!==t);
    }
  });
  storageSet(MILESTONE_KEY, JSON.stringify(reachedMilestones));
}

function spawnConfetti(count){
  const overlay = document.createElement("div");
  overlay.className = "confetti-overlay";
  const colors = ["#C9971F","#1B4332","#B5482A","#8FBF9F","#EDE8DC","#41527A"];
  for(let i=0;i<count;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = (Math.random()*100)+"vw";
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    const duration = 2.4 + Math.random()*1.6;
    const delay = Math.random()*0.4;
    piece.style.animationDuration = duration+"s";
    piece.style.animationDelay = delay+"s";
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    overlay.appendChild(piece);
  }
  document.body.appendChild(overlay);
  setTimeout(()=> overlay.remove(), 4600);
}

function showBanner(text, duration){
  const banner = document.createElement("div");
  banner.className = "celebrate-banner";
  banner.textContent = text;
  document.body.appendChild(banner);
  requestAnimationFrame(()=> banner.classList.add("show"));
  setTimeout(()=>{
    banner.classList.remove("show");
    setTimeout(()=> banner.remove(), 300);
  }, duration || 2600);
}

/* ================= LISTA DE FALTANTES (imprimir / copiar) ================= */
function buildMissingList(){
  const teams = [];
  sections.forEach(sec=>{
    const missing = sec.items.filter(it=> !owned[sec.slug+"__"+it.num]);
    if(missing.length>0) teams.push({sec, missing});
  });
  return teams;
}

function buildMissingReportText(){
  const teams = buildMissingList();
  const {total, own} = totalCounts();
  if(teams.length===0){
    return `Cromos que me faltan · Liga Este 26-27\nProgreso: ${own}/${total}\n\n¡Enhorabuena! No te falta ningún cromo. 🏆`;
  }
  let lines = [`Cromos que me faltan · Liga Este 26-27`, `Progreso: ${own}/${total}`, ""];
  teams.forEach(({sec, missing})=>{
    lines.push(`${sec.name.toUpperCase()} (${missing.length} faltan)`);
    missing.forEach(it=>{
      lines.push(`#${it.num} — ${it.name || "Cromo sin revelar"}${it.ed ? " (2ª ed.)" : ""}`);
    });
    lines.push("");
  });
  return lines.join("\n").trim();
}

/* ================= CURIOSIDADES ================= */
function capitalize(s){
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function buildFunFacts(){
  const {total, own, totalSegunda, ownSegunda} = totalCounts();
  const facts = [];

  const withProgress = sections.filter(sec=> sectionCounts(sec).total>0);
  const completedTeams = withProgress.filter(sec=>{
    const c = sectionCounts(sec);
    return c.own===c.total;
  });
  facts.push(`Tienes ${completedTeams.length} de ${withProgress.length} equipos/categorías completos.`);

  let lowest = null, highest = null;
  withProgress.forEach(sec=>{
    const c = sectionCounts(sec);
    const pct = c.own/c.total;
    if(pct < 1){
      if(!lowest || pct < lowest.pct) lowest = {name: sec.name, pct, own:c.own, total:c.total};
      if(!highest || pct > highest.pct) highest = {name: sec.name, pct, own:c.own, total:c.total};
    }
  });
  if(lowest) facts.push(`Tu punto más flojo es <strong>${lowest.name}</strong>: ${lowest.own}/${lowest.total} (${Math.round(lowest.pct*100)}%).`);
  if(highest) facts.push(`Estás más cerca de completar <strong>${highest.name}</strong>: solo te ${highest.total-highest.own===1 ? "falta 1 cromo" : `faltan ${highest.total-highest.own} cromos`}.`);

  const roleStats = {};
  sections.forEach(sec=>{
    sec.items.forEach(it=>{
      if(!it.role) return;
      if(!roleStats[it.role]) roleStats[it.role] = {total:0, own:0};
      roleStats[it.role].total++;
      if(owned[sec.slug+"__"+it.num]) roleStats[it.role].own++;
    });
  });
  const roleEntries = Object.entries(roleStats)
    .map(([role, s])=> ({role, pct: s.own/s.total, own:s.own, total:s.total}))
    .filter(r=> r.total>0);
  roleEntries.sort((a,b)=> b.pct - a.pct);
  if(roleEntries.length){
    const best = roleEntries[0];
    const worst = roleEntries[roleEntries.length-1];
    facts.push(`Tu posición más completa: <strong>${capitalize(best.role)}</strong> (${best.own}/${best.total}, ${Math.round(best.pct*100)}%).`);
    if(worst.role !== best.role){
      facts.push(`Tu posición más floja: <strong>${capitalize(worst.role)}</strong> (${worst.own}/${worst.total}, ${Math.round(worst.pct*100)}%).`);
    }
  }

  if(totalSegunda>0){
    facts.push(`De los cromos de <strong>2ª edición</strong>, tienes ${ownSegunda}/${totalSegunda}.`);
  }

  facts.push(`Llevas un <strong>${total? Math.round(own/total*100):0}%</strong> del álbum completo (${own}/${total} cromos).`);

  return facts;
}

document.getElementById("curiosidadesBtn").addEventListener("click", ()=>{
  const facts = buildFunFacts();

/* ================= STATE ================= */
let owned = {}; // key: `${slug}__${num}` -> true
let sectionOpen = {};
let activeFilter = "todos";
let searchTerm = "";

const STORAGE_KEY = "owned-stickers-v1";

/* Guardado con doble vía: usa window.storage si está disponible (dentro de Claude),
   y si no, cae automáticamente a localStorage (archivo abierto suelto, ej. en el iPhone). */
const hasClaudeStorage = () => (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function");

async function storageGet(key){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(key);
      return res ? res.value : null;
    }catch(e){ return null; }
  }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}

async function storageSet(key, value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value); return true; }catch(e){ /* fall through */ }
  }
  try{ window.localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

async function loadState(){
  try{
    const val = await storageGet(STORAGE_KEY);
    if(val){ owned = JSON.parse(val); }
  }catch(e){
    owned = {};
  }
  render();
}

let saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const ok = await storageSet(STORAGE_KEY, JSON.stringify(owned));
    if(ok) showToast();
  }, 250);
}

function showToast(message){
  const t = document.getElementById("toast");
  t.textContent = message || "Guardado";
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 1500);
}

/* ================= MODAL PROPIO (sustituye alert/prompt/confirm) ================= */
function openModal(title, bodyEl, buttons){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const card = document.createElement("div");
  card.className = "modal-card";
  const h = document.createElement("div");
  h.className = "modal-title";
  h.textContent = title;
  card.appendChild(h);
  card.appendChild(bodyEl);
  const actions = document.createElement("div");
  actions.className = "modal-actions";
  buttons.forEach(cfg=>{
    const btn = document.createElement("button");
    btn.className = "modal-btn" + (cfg.primary ? " primary" : "");
    btn.textContent = cfg.label;
    btn.onclick = ()=>{
      overlay.remove();
      if(cfg.onClick) cfg.onClick();
    };
    actions.appendChild(btn);
  });
  card.appendChild(actions);
  overlay.appendChild(card);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}

function showCopyableText(title, text){
  const wrap = document.createElement("div");
  const p = document.createElement("p");
  p.className = "modal-hint";
  p.textContent = 'Mantén pulsado el texto de abajo y elige "Seleccionar todo" y "Copiar".';
  const ta = document.createElement("textarea");
  ta.className = "modal-textarea";
  ta.readOnly = true;
  ta.value = text;
  wrap.appendChild(p);
  wrap.appendChild(ta);
  openModal(title, wrap, [{label:"Cerrar", primary:true}]);
  setTimeout(()=>{
    ta.focus();
    ta.select();
    try{ navigator.clipboard.writeText(text); }catch(e){ /* el textarea ya sirve de respaldo */ }
  }, 60);
}

function showConfirmModal(message, onConfirm){
  const wrap = document.createElement("div");
  const p = document.createElement("p");
  p.style.margin = "0";
  p.style.fontSize = "13.5px";
  p.textContent = message;
  wrap.appendChild(p);
  openModal("Confirmar", wrap, [
    {label:"Cancelar"},
    {label:"Sí, continuar", primary:true, onClick:onConfirm}
  ]);
}

/* ================= RENDER ================= */
function totalCounts(){
  let total = 0, own = 0, totalNormal = 0, ownNormal = 0, totalSegunda = 0, ownSegunda = 0;
  sections.forEach(sec=>{
    sec.items.forEach(it=>{
      total++;
      const isOwned = !!owned[sec.slug+"__"+it.num];
      if(isOwned) own++;
      if(it.ed){
        totalSegunda++;
        if(isOwned) ownSegunda++;
      } else {
        totalNormal++;
        if(isOwned) ownNormal++;
      }
    });
  });
  return {total, own, totalNormal, ownNormal, totalSegunda, ownSegunda};
}

function sectionCounts(sec){
  let total = sec.items.length, own = 0;
  sec.items.forEach(it=>{ if(owned[sec.slug+"__"+it.num]) own++; });
  return {total, own};
}

function matchesSearch(sec, it){
  if(!searchTerm) return true;
  const hay = (sec.name + " " + it.num + " " + it.name + " " + it.role).toLowerCase();
  return hay.includes(searchTerm);
}

function renderFilterChips(){
  const row = document.getElementById("filterRow");
  const chips = [{key:"todos", label:"Todos"}, {key:"faltan", label:"Me faltan"}, {key:"tengo", label:"Ya tengo"}];
  row.innerHTML = "";
  chips.forEach(c=>{
    const el = document.createElement("div");
    el.className = "chip" + (activeFilter===c.key ? " active":"");
    el.textContent = c.label;
    el.onclick = ()=>{ activeFilter = c.key; render(); };
    row.appendChild(el);
  });
}

/* ================= VISTA MOSAICO ================= */
let viewMode = "list"; // "list" | "mosaic"

function goToSection(slug){
  viewMode = "list";
  applyViewMode();
  sectionOpen[slug] = true;
  render();
  setTimeout(()=>{
    const el = document.querySelector(`.section[data-slug="${slug}"]`);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }, 50);
}

function applyViewMode(){
  const isMosaic = viewMode === "mosaic";
  document.getElementById("mosaicView").style.display = isMosaic ? "grid" : "none";
  document.getElementById("sections").style.display = isMosaic ? "none" : "block";
  document.querySelector(".filter-row").style.display = isMosaic ? "none" : "flex";
  document.getElementById("search").style.display = isMosaic ? "none" : "block";
  document.getElementById("toggleAll").style.display = isMosaic ? "none" : "inline-block";
  document.getElementById("viewToggle").textContent = isMosaic ? "📋 Lista" : "🗂️ Mosaico";
}

document.getElementById("viewToggle").addEventListener("click", ()=>{
  viewMode = viewMode === "mosaic" ? "list" : "mosaic";
  applyViewMode();
  if(viewMode === "mosaic") renderMosaic();
});

function renderMosaic(){
  const container = document.getElementById("mosaicView");
  if(!container) return;
  container.innerHTML = "";
  sections.forEach(sec=>{
    const {total, own} = sectionCounts(sec);
    const pct = total ? Math.round(own/total*100) : 0;
    const isComplete = total>0 && own===total;
    const logo = LOGOS[sec.slug];
    const initials = sec.name.replace(/[^A-ZÁÉÍÓÚÑa-záéíóúñ ]/g,"").split(" ").filter(w=>w.length>0).slice(0,2).map(w=>w[0].toUpperCase()).join("");

    const item = document.createElement("div");
    item.className = "mosaic-item";
    item.innerHTML = `
      <div class="mosaic-badge${isComplete ? " complete":""}">
        ${logo ? `<img src="${logo}" alt="${sec.name}">` : `<div class="initials" style="background:${sec.accent}">${initials||"•"}</div>`}
        ${isComplete ? `<div class="mosaic-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M5 13l4 4L19 7"/></svg></div>` : ""}
      </div>
      <div class="mosaic-name">${sec.name}</div>
      <div class="mosaic-pct">${own}/${total} · ${pct}%</div>
    `;
    item.onclick = ()=> goToSection(sec.slug);
    container.appendChild(item);
  });
}

function render(){
  renderFilterChips();
  const {total, own, totalNormal, ownNormal, totalSegunda, ownSegunda} = totalCounts();
  document.getElementById("totalOwned").textContent = own + " / " + total;
  document.getElementById("totalPct").textContent = (total? Math.round(own/total*100):0) + "% completado";
  document.getElementById("totalBar").style.width = (total? (own/total*100):0) + "%";

  document.getElementById("normalCount").textContent = ownNormal + "/" + totalNormal;
  document.getElementById("normalBar").style.width = (totalNormal? (ownNormal/totalNormal*100):0) + "%";
  document.getElementById("segundaCount").textContent = ownSegunda + "/" + totalSegunda;
  document.getElementById("segundaBar").style.width = (totalSegunda? (ownSegunda/totalSegunda*100):0) + "%";

  updateRegistry(total, own).then(()=> renderSummaryPanel());
  renderMosaic();

  const container = document.getElementById("sections");
  container.innerHTML = "";

  let anyVisible = false;

  sections.forEach((sec, si)=>{
    // filter items
    let visibleItems = sec.items.filter(it=>{
      if(!matchesSearch(sec, it)) return false;
      const isOwned = !!owned[sec.slug+"__"+it.num];
      if(activeFilter==="faltan" && isOwned) return false;
      if(activeFilter==="tengo" && !isOwned) return false;
      return true;
    });
    if(searchTerm && visibleItems.length===0) return;
    if(activeFilter!=="todos" && visibleItems.length===0 && !searchTerm) {
      // still show section header even if fully done/undone? skip empty
      return;
    }
    anyVisible = true;

    const {total:st, own:so} = sectionCounts(sec);
    const isOpen = sectionOpen[sec.slug] ?? (searchTerm.length>0);

    const secEl = document.createElement("div");
    secEl.className = "section" + (isOpen ? " open":"");
    secEl.setAttribute("data-slug", sec.slug);
    secEl.style.setProperty("--accent", sec.accent);

    const initials = sec.name.replace(/[^A-ZÁÉÍÓÚÑa-záéíóúñ ]/g,"").split(" ").filter(w=>w.length>0).slice(0,2).map(w=>w[0].toUpperCase()).join("");
    const logo = LOGOS[sec.slug];
    const badgeInner = logo ? `<img src="${logo}" alt="${sec.name}">` : (initials || "•");
    const badgeClass = logo ? "badge has-logo" : "badge";
    const isSecComplete = st > 0 && so === st;
    const completeCheck = isSecComplete ? `<svg class="complete-check" viewBox="0 0 24 24" fill="none" stroke="#2F7D46" stroke-width="3.2"><path d="M5 13l4 4L19 7"/></svg>` : "";
    const tagPill = sec.tag ? `<span class="rarity-tag" style="background:${sec.accent}">${sec.tag}</span>` : "";

    secEl.style.setProperty("--accent", isSecComplete ? "#2F7D46" : sec.accent);

    secEl.innerHTML = `
      <div class="section-head">
        <div class="section-head-left">
          <div class="${badgeClass}">${badgeInner}</div>
          <div style="min-width:0;">
            <div class="section-title">${sec.name}${tagPill}${completeCheck}</div>
            <div class="section-sub">${so} / ${st} cromos</div>
          </div>
        </div>
        <div class="section-right">
          <div class="mini-bar"><div class="mini-bar-fill" style="width:${st? (so/st*100):0}%"></div></div>
          <button class="mark-all-btn" data-slug="${sec.slug}">${isSecComplete ? "Desmarcar" : "Marcar todo"}</button>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="section-body"></div>
    `;

    const head = secEl.querySelector(".section-head");
    head.onclick = ()=>{
      sectionOpen[sec.slug] = !isOpen;
      render();
    };

    const markAllBtn = secEl.querySelector(".mark-all-btn");
    markAllBtn.onclick = (ev)=>{
      ev.stopPropagation();

      if(isSecComplete){
        // Desmarcar todo el equipo/categoría
        sec.items.forEach(it=>{ delete owned[sec.slug+"__"+it.num]; });
      } else {
        // Marcar todo el equipo/categoría
        sec.items.forEach(it=>{ owned[sec.slug+"__"+it.num] = true; });
      }
      persist();

      sectionOpen[sec.slug] = true;
      render();
      checkMilestones();

      if(!isSecComplete){
        const afterTotal = totalCounts();
        const isAllComplete = afterTotal.total>0 && afterTotal.own===afterTotal.total;
        if(!isAllComplete){
          celebrateTeam(sec.name);
        }
      }
    };

    const body = secEl.querySelector(".section-body");
    visibleItems.forEach(it=>{
      const key = sec.slug+"__"+it.num;
      const isOwned = !!owned[key];
      const row = document.createElement("div");
      row.className = "row" + (isOwned ? " owned":"");
      row.innerHTML = `
        <div class="num">${it.num}</div>
        <div class="row-name">
          <div class="name">${it.name ? it.name : '<em style="color:var(--ink-soft);font-style:italic;">Cromo sin revelar</em>'}${it.ed ? '<span class="ed-badge">2ª ed.</span>':''}</div>
          ${it.role ? `<div class="role">${it.role}</div>` : ""}
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>
      `;
      row.onclick = ()=>{
        const beforeSec = sectionCounts(sec);
        const wasSecComplete = beforeSec.total>0 && beforeSec.own===beforeSec.total;

        if(owned[key]){
          delete owned[key];
        } else {
          owned[key] = true;
        }
        persist();

        const afterSec = sectionCounts(sec);
        const isSecComplete = afterSec.total>0 && afterSec.own===afterSec.total;

        render();
        checkMilestones();

        if(!wasSecComplete && isSecComplete){
          const afterTotal = totalCounts();
          const isAllComplete = afterTotal.total>0 && afterTotal.own===afterTotal.total;
          if(!isAllComplete){
            celebrateTeam(sec.name);
          }
        }
      };
      body.appendChild(row);
    });

    container.appendChild(secEl);
  });

  if(!anyVisible){
    container.innerHTML = `<div class="empty-state">No hay cromos que coincidan con tu búsqueda.</div>`;
  }
}

/* ================= EVENTS ================= */
document.getElementById("search").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

let allExpanded = false;
document.getElementById("toggleAll").addEventListener("click", ()=>{
  allExpanded = !allExpanded;
  sections.forEach(sec=> sectionOpen[sec.slug] = allExpanded);
  document.getElementById("toggleAll").textContent = allExpanded ? "Colapsar todo" : "Expandir todo";
  render();
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  showConfirmModal("¿Seguro que quieres borrar todo tu progreso? Esta acción no se puede deshacer.", ()=>{
    owned = {};
    persist();
    render();
    showToast("Checklist reiniciado");
  });
});

document.getElementById("missingBtn").addEventListener("click", ()=>{
  const text = buildMissingReportText();
  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "faltantes-liga-este.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Archivo descargado");
});

document.getElementById("copyMissingBtn").addEventListener("click", ()=>{
  const text = buildMissingReportText();
  showCopyableText("Lista de faltantes", text);
});

document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(owned, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "progreso-cromos-liga-este.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Progreso exportado");
});

document.getElementById("importBtn").addEventListener("click", ()=>{
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const data = JSON.parse(evt.target.result);
      owned = Object.assign({}, owned, data);
      persist();
      render();
      showToast("Progreso importado");
    }catch(err){
      showToast("No se ha podido leer ese archivo");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

applyViewMode();

async function init(){
  await loadMilestones();
  await loadState(); // internamente llama a render(), que ya usa reachedMilestones
  syncMilestonesSilently();
  storageSet(MILESTONE_KEY, JSON.stringify(reachedMilestones));
}
init();
initThemeButton();
loadThemePreference();
initDensityButton();
loadDensityPreference();
</script>
</body>
</html>
